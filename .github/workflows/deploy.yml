name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      # Rebuild on any source file change across all three sites
      - "apps/web/**"
      - "apps/neil/**"
      - "apps/el-portugues/**"
      - "infra/supabase/**"
      - "package*.json"
      - "scripts/build-deploy.sh"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: # allow manual trigger from GitHub UI or n8n automation

permissions:
  contents: write # needed to push to gh-pages branch

jobs:
  # ── Build jobs run in parallel ─────────────────────────────────────────────

  build-cv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install CV dependencies
        run: npm ci

      - name: Build CV site (static export)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build --workspace=cv

      - name: Upload CV build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cv-out
          path: apps/web/out/
          retention-days: 1

  build-neil:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install Neil dependencies
        run: npm ci

      - name: Build Neil site (static export)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_N8N_CONTACT_WEBHOOK: ${{ secrets.NEXT_PUBLIC_N8N_NEIL_CONTACT_WEBHOOK }}
          NEXT_PUBLIC_N8N_QUOTE_WEBHOOK: ${{ secrets.NEXT_PUBLIC_N8N_NEIL_QUOTE_WEBHOOK }}
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
        run: npm run build --workspace=neil-landing

      - name: Upload Neil build artifact
        uses: actions/upload-artifact@v4
        with:
          name: neil-out
          path: apps/neil/out/
          retention-days: 1

  build-elportugues:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install El Portugués dependencies
        run: npm ci

      - name: Build El Portugués site (static export)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_N8N_CONTACT_WEBHOOK: ${{ secrets.NEXT_PUBLIC_N8N_EP_CONTACT_WEBHOOK }}
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
        run: npm run build --workspace=elportugues-landing

      - name: Upload El Portugués build artifact
        uses: actions/upload-artifact@v4
        with:
          name: elportugues-out
          path: apps/el-portugues/out/
          retention-days: 1

  # ── Deploy: waits for all 3 builds, merges outputs, pushes to gh-pages ─────

  deploy:
    needs: [build-cv, build-neil, build-elportugues]
    runs-on: ubuntu-latest

    steps:
      - name: Download CV build artifact
        uses: actions/download-artifact@v4
        with:
          name: cv-out
          path: /tmp/deploy/cv-out/

      - name: Download Neil build artifact
        uses: actions/download-artifact@v4
        with:
          name: neil-out
          path: /tmp/deploy/neil-out/

      - name: Download El Portugués build artifact
        uses: actions/download-artifact@v4
        with:
          name: elportugues-out
          path: /tmp/deploy/elportugues-out/

      - name: Assemble final deploy directory
        run: |
          DEPLOY=/tmp/deploy/site

          # 1. Start with CV output as the root (blog/, _next/, index.html, etc.)
          rsync -a /tmp/deploy/cv-out/ $DEPLOY/

          # 2. Add neil-site/ subdirectory
          mkdir -p $DEPLOY/neil-site
          rsync -a /tmp/deploy/neil-out/ $DEPLOY/neil-site/

          # 3. Add elportugues-site/ subdirectory
          mkdir -p $DEPLOY/elportugues-site
          rsync -a /tmp/deploy/elportugues-out/ $DEPLOY/elportugues-site/

          # 4. GitHub Pages compatibility marker. All other static files are
          #    included in the CV artifact from apps/web/public.
          touch $DEPLOY/.nojekyll

          echo "Deploy directory contents:"
          ls -la $DEPLOY/

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: /tmp/deploy/site
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "chore: deploy all sites ${{ github.sha }}"
